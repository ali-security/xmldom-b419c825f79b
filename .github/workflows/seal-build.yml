# SEAL: build-and-pack only. The test suite runs on Travis (.travis.yml -> npm test -> t/test).
# Rebuilds the org.webjars.npm:xmldom WebJar the way WebJars does: the npm
# tarball's contents under META-INF/resources/webjars/xmldom/<version>/ plus the
# generated Maven pom.xml / pom.properties, in a jar with no MANIFEST.MF.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  webjar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 12.14.0 bundles npm 6.13.4, the npm that packed the published
      # xmldom-0.1.31.tgz; npm 7+ no longer always-includes `changelog`.
      - uses: actions/setup-node@v4
        with:
          node-version: '12.14.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: npm pack
        run: |
          node --version
          npm --version
          mkdir -p dist
          npm pack
          mv xmldom-0.1.31.tgz dist/

      - name: Assemble WebJar
        run: |
          VERSION=0.1.31
          STAGING="$RUNNER_TEMP/webjar"
          WEBJAR_DIR="$STAGING/META-INF/resources/webjars/xmldom/$VERSION"
          MAVEN_DIR="$STAGING/META-INF/maven/org.webjars.npm/xmldom"
          mkdir -p "$WEBJAR_DIR" "$MAVEN_DIR" "$RUNNER_TEMP/unpack"
          tar -xzf dist/xmldom-$VERSION.tgz -C "$RUNNER_TEMP/unpack"
          cp -a "$RUNNER_TEMP/unpack/package/." "$WEBJAR_DIR/"

          # Byte-for-byte the WebJars template: a leading blank line and
          # 7 trailing spaces with no final newline.
          printf '\n#Generated by WebJar Sync\nversion=%s\ngroupId=org.webjars.npm\nartifactId=xmldom\n       ' \
            "$VERSION" > "$MAVEN_DIR/pom.properties"

          # The WebJars template leaves indentation on its blank lines; a
          # trailing `|` marks those lines and is stripped below.
          sed 's/|$//' > "$MAVEN_DIR/pom.xml" <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/maven-v4_0_0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <packaging>jar</packaging>
              <groupId>org.webjars.npm</groupId>
              <artifactId>xmldom</artifactId>
              <version>0.1.31</version>
              <name>xmldom</name>
              <description>WebJar for xmldom</description>
              <url>https://www.webjars.org</url>

              <properties>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <scm>
                  <url>https://github.com/xmldom/xmldom</url>
                  <connection>https://github.com/xmldom/xmldom.git</connection>
                  <developerConnection>https://github.com/xmldom/xmldom.git</developerConnection>
                  <tag>v0.1.31</tag>
              </scm>

              <developers>
                  <developer>
                      <id>webjars</id>
                      <url>https://www.webjars.org</url>
                  </developer>
              </developers>

              <licenses>
                  |
                  <license>
                      <name>LGPL-2.0</name>
                      <url>https://spdx.org/licenses/LGPL-2.0#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  |
                  <license>
                      <name>MIT</name>
                      <url>https://spdx.org/licenses/MIT#licenseText</url>
                      <distribution>repo</distribution>
                  </license>
                  |
              </licenses>

              |
              <issueManagement>
                  <url>https://github.com/xmldom/xmldom/issues</url>
              </issueManagement>
              |

              <dependencies>
                  |
                  |
              </dependencies>

          </project>
          POM

          cd "$STAGING"
          jar cMf "$GITHUB_WORKSPACE/dist/xmldom-$VERSION.jar" META-INF
          # The published WebJar carries no directory entries for META-INF/maven/**.
          zip -d "$GITHUB_WORKSPACE/dist/xmldom-$VERSION.jar" 'META-INF/maven/' 'META-INF/maven/org.webjars.npm/' 'META-INF/maven/org.webjars.npm/xmldom/'
          jar tf "$GITHUB_WORKSPACE/dist/xmldom-$VERSION.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: xmldom-webjar
          path: dist/xmldom-0.1.31.jar
          if-no-files-found: error
